<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Design Space Portal</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        /* Base typography and clean light background */
        :root {
            --bg-color: #f4f5f7;
            --text-main: #1d1d1f;
            --text-muted: #86868b;
            --card-bg: #ffffff;
            --shadow-soft: 0 10px 30px rgba(0, 0, 0, 0.04), 0 1px 3px rgba(0, 0, 0, 0.02);
            --shadow-hover: 0 20px 40px rgba(0, 0, 0, 0.08), 0 4px 12px rgba(0, 0, 0, 0.04);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-color);
            min-height: 100vh;
            margin: 0;
            padding: 40px 20px;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
            position: relative;
        }

        /* Top Bar with Gear Icon */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 50px;
            padding: 0 10px;
        }

        .logo-container img {
            height: 80px; /* Increased logo size */
            width: auto;
            object-fit: contain;
        }

        .settings-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-muted);
            padding: 10px;
            border-radius: 50%;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .settings-btn:hover {
            background: rgba(0,0,0,0.05);
            color: var(--text-main);
            transform: rotate(45deg);
        }

        .settings-btn svg {
            width: 28px;
            height: 28px;
        }

        /* Responsive grid for the navigation cards */
        .nav-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 30px;
            justify-items: center;
        }

        /* Premium Squircle Card Styling */
        .nav-card {
            background: var(--card-bg);
            width: 160px;
            height: 160px;
            border-radius: 35px; /* iOS style squircle */
            text-decoration: none;
            color: var(--text-main);
            box-shadow: var(--shadow-soft);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .nav-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: var(--shadow-hover);
        }

        /* Icon Container */
        .icon-wrapper {
            width: 80px;
            height: 80px;
            transition: transform 0.3s ease;
        }

        .nav-card:hover .icon-wrapper {
            transform: scale(0.9) translateY(-15px);
        }

        /* Hover Overlay for Name */
        .hover-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 15px 10px;
            text-align: center;
            transform: translateY(100%);
            transition: transform 0.3s ease;
            border-top: 1px solid rgba(0,0,0,0.05);
        }

        .nav-card:hover .hover-overlay {
            transform: translateY(0);
        }

        .nav-title {
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 2px;
            color: var(--text-main);
        }

        .nav-desc {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Settings Modal UI */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(4px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
        }

        .modal {
            background: white;
            padding: 30px;
            border-radius: 24px;
            width: 90%;
            max-width: 450px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.15);
            transform: translateY(20px);
            transition: transform 0.3s ease;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-overlay.active .modal {
            transform: translateY(0);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .modal-header h2 {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 600;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-muted);
        }

        /* App List in Settings */
        .app-list-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 15px;
            background: var(--bg-color);
            border-radius: 12px;
            margin-bottom: 10px;
        }

        .app-list-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .app-list-info svg {
            width: 32px; height: 32px;
        }

        .app-list-actions button {
            background: none;
            border: none;
            cursor: pointer;
            padding: 6px;
            border-radius: 6px;
            margin-left: 5px;
        }

        .btn-edit { color: #007aff; background: rgba(0,122,255,0.1); }
        .btn-delete { color: #ff3b30; background: rgba(255,59,48,0.1); }
        
        .btn-primary {
            background: #000;
            color: #fff;
            border: none;
            padding: 12px 20px;
            border-radius: 12px;
            width: 100%;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            margin-top: 15px;
            transition: background 0.2s;
        }
        .btn-primary:hover { background: #333; }

        /* Form Inputs */
        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group label { display: block; font-size: 0.85rem; margin-bottom: 6px; font-weight: 500; color: var(--text-muted); }
        .form-group input, .form-group select {
            width: 100%; padding: 10px 12px; border: 1px solid #e1e1e1; 
            border-radius: 10px; box-sizing: border-box; font-family: inherit;
            background: #f9f9f9;
            transition: border-color 0.2s;
        }
        .form-group input:focus, .form-group select:focus {
            outline: none; border-color: #007aff; background: #fff;
        }

        .modal-buttons { display: flex; gap: 10px; margin-top: 25px; }
        .modal-buttons button { flex: 1; padding: 12px; border-radius: 10px; cursor: pointer; border: none; font-weight: 500; }
        .btn-cancel { background: #e1e1e1; color: var(--text-main); }
        .btn-save { background: #007aff; color: white; }

    </style>
</head>
<body>

    <div class="container">
        <!-- Top Bar -->
        <div class="top-bar">
            <div class="logo-container">
                <!-- Main Logo -->
                <img src="ds icon.png" alt="Design Space Logo" onerror="this.src='https://via.placeholder.com/150x50?text=Design+Space'">
            </div>
            
            <!-- Sleek Settings Gear -->
            <button class="settings-btn" onclick="openSettings()" title="Settings">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                </svg>
            </button>
        </div>

        <!-- Navigation Links Container -->
        <nav class="nav-grid" id="appsContainer">
            <!-- Cards generated by JS -->
        </nav>
    </div>

    <!-- MAIN SETTINGS MODAL -->
    <div class="modal-overlay" id="settingsModal">
        <div class="modal">
            <div class="modal-header">
                <h2>Settings</h2>
                <button class="close-btn" onclick="closeModals()">&times;</button>
            </div>
            
            <div id="appListContainer">
                <!-- App list generated by JS -->
            </div>

            <button class="btn-primary" onclick="openAddEditModal()">+ Add New App</button>
        </div>
    </div>

    <!-- ADD/EDIT APP MODAL -->
    <div class="modal-overlay" id="editModal">
        <div class="modal">
            <div class="modal-header">
                <h2 id="editModalTitle">Edit App</h2>
                <button class="close-btn" onclick="openSettings()">&times;</button>
            </div>
            
            <input type="hidden" id="appId">
            
            <div class="form-group">
                <label>App Name</label>
                <input type="text" id="appName" placeholder="e.g. Invoices">
            </div>
            <div class="form-group">
                <label>Link / URL</label>
                <input type="text" id="appUrl" placeholder="e.g. invoice.html">
            </div>
            <div class="form-group">
                <label>Description (Shows on Hover)</label>
                <input type="text" id="appDesc" placeholder="Brief description...">
            </div>
            <div class="form-group">
                <label>Icon Style</label>
                <select id="appIcon">
                    <option value="home">Home / Heart (Blue)</option>
                    <option value="calc">Calculator (Blue/Cyan)</option>
                    <option value="ticket">Tickets / Money (Yellow/Orange)</option>
                    <option value="cloud">Cloud / Download (Purple/Pink)</option>
                    <option value="generic">Generic App (Green)</option>
                </select>
            </div>

            <div class="modal-buttons">
                <button class="btn-cancel" onclick="openSettings()">Cancel</button>
                <button class="btn-save" onclick="saveApp()">Save Changes</button>
            </div>
        </div>
    </div>

    <script>
        // Custom Glassmorphism SVG Icons matching your reference image
        const svgIcons = {
            home: `
                <svg viewBox="0 0 100 100" fill="none">
                    <defs>
                        <linearGradient id="homeGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#80d0ff" />
                            <stop offset="100%" stop-color="#007aff" />
                        </linearGradient>
                        <linearGradient id="homeGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
                            <stop offset="100%" stop-color="#d0edff" stop-opacity="0.6"/>
                        </linearGradient>
                    </defs>
                    <path d="M55 25 L90 55 L90 90 L55 90 Z" fill="url(#homeGrad1)" rx="10"/>
                    <path d="M10 55 L45 25 L80 55 L80 90 L10 90 Z" fill="url(#homeGrad2)" style="backdrop-filter: blur(5px);"/>
                    <path d="M45 45 C45 45 35 35 25 45 C15 55 45 75 45 75 C45 75 75 55 65 45 C55 35 45 45 45 45 Z" fill="#ffffff" opacity="0.9"/>
                </svg>`,
            calc: `
                <svg viewBox="0 0 100 100" fill="none">
                    <defs>
                        <linearGradient id="calcGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#4facfe" />
                            <stop offset="100%" stop-color="#00f2fe" />
                        </linearGradient>
                        <linearGradient id="calcGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#0052d4" />
                            <stop offset="100%" stop-color="#4364f7" />
                        </linearGradient>
                    </defs>
                    <circle cx="40" cy="50" r="35" fill="url(#calcGrad2)" />
                    <rect x="35" y="25" width="55" height="55" rx="16" fill="url(#calcGrad1)" opacity="0.9" style="backdrop-filter: blur(4px);"/>
                    <path d="M48 42 h10 M53 37 v10 M72 42 h10 M48 62 l10 10 M58 62 l-10 10 M72 65 h10 M72 69 h10" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
                </svg>`,
            ticket: `
                <svg viewBox="0 0 100 100" fill="none">
                    <defs>
                        <linearGradient id="tixGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#f6d365" />
                            <stop offset="100%" stop-color="#fda085" />
                        </linearGradient>
                        <linearGradient id="tixGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#ffb114" />
                            <stop offset="100%" stop-color="#ff8c00" />
                        </linearGradient>
                    </defs>
                    <rect x="15" y="30" width="70" height="45" rx="10" fill="url(#tixGrad2)" />
                    <circle cx="15" cy="52.5" r="8" fill="var(--card-bg)" />
                    <circle cx="85" cy="52.5" r="8" fill="var(--card-bg)" />
                    
                    <rect x="25" y="40" width="70" height="45" rx="10" fill="url(#tixGrad1)" opacity="0.95"/>
                    <circle cx="25" cy="62.5" r="8" fill="var(--card-bg)" />
                    <circle cx="95" cy="62.5" r="8" fill="var(--card-bg)" />
                    
                    <text x="60" y="72" font-family="sans-serif" font-weight="bold" font-size="24" fill="#fff" text-anchor="middle">$</text>
                </svg>`,
            cloud: `
                <svg viewBox="0 0 100 100" fill="none">
                    <defs>
                        <linearGradient id="cloudGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#d558c8" />
                            <stop offset="100%" stop-color="#24d2fe" />
                        </linearGradient>
                        <linearGradient id="cloudGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#b100ff" />
                            <stop offset="100%" stop-color="#ff00b1" />
                        </linearGradient>
                    </defs>
                    <circle cx="45" cy="40" r="30" fill="url(#cloudGrad2)" />
                    <path d="M30 65 A 20 20 0 0 1 30 25 A 25 25 0 0 1 80 35 A 20 20 0 0 1 70 70 Z" fill="url(#cloudGrad1)" opacity="0.85" style="backdrop-filter: blur(5px);"/>
                    <path d="M55 45 v15 m-7 -7 l7 7 l7 -7" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>`,
            generic: `
                <svg viewBox="0 0 100 100" fill="none">
                    <defs>
                        <linearGradient id="genGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#43e97b" />
                            <stop offset="100%" stop-color="#38f9d7" />
                        </linearGradient>
                    </defs>
                    <rect x="20" y="20" width="60" height="60" rx="20" fill="url(#genGrad)" />
                    <circle cx="50" cy="50" r="12" fill="#fff" opacity="0.9"/>
                </svg>`
        };

        // Default Data
        let apps = [
            { id: 1, title: "Order Entry", url: "order.html", desc: "Orders Entry Dashboard", icon: "home" },
            { id: 2, title: "Cost Estimator", url: "costcalc.html", desc: "Printing estimates.", icon: "calc" },
            { id: 3, title: "Expenses", url: "expenses.html", desc: "Track operational costs.", icon: "ticket" },
            { id: 4, title: "Staff Config", url: "staff.html", desc: "Team details & schedules.", icon: "cloud" }
        ];

        // --- Core Rendering ---
        function renderGrid() {
            const container = document.getElementById('appsContainer');
            container.innerHTML = '';

            apps.forEach(app => {
                const card = document.createElement('a');
                card.href = app.url;
                card.className = 'nav-card';
                card.innerHTML = `
                    <div class="icon-wrapper">
                        ${svgIcons[app.icon] || svgIcons['generic']}
                    </div>
                    <div class="hover-overlay">
                        <div class="nav-title">${app.title}</div>
                        <div class="nav-desc">${app.desc}</div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // --- Settings Modal Logic ---
        function openSettings() {
            closeModals();
            const listContainer = document.getElementById('appListContainer');
            listContainer.innerHTML = '';
            
            apps.forEach(app => {
                const row = document.createElement('div');
                row.className = 'app-list-item';
                row.innerHTML = `
                    <div class="app-list-info">
                        ${svgIcons[app.icon] || svgIcons['generic']}
                        <strong>${app.title}</strong>
                    </div>
                    <div class="app-list-actions">
                        <button class="btn-edit" onclick="openAddEditModal(${app.id})">Edit</button>
                        <button class="btn-delete" onclick="deleteApp(${app.id})">Del</button>
                    </div>
                `;
                listContainer.appendChild(row);
            });

            const modal = document.getElementById('settingsModal');
            modal.style.display = 'flex';
            setTimeout(() => modal.classList.add('active'), 10);
        }

        function openAddEditModal(id = null) {
            closeModals();
            const modal = document.getElementById('editModal');
            
            if (id) {
                const app = apps.find(a => a.id === id);
                document.getElementById('editModalTitle').innerText = "Edit App";
                document.getElementById('appId').value = app.id;
                document.getElementById('appName').value = app.title;
                document.getElementById('appUrl').value = app.url;
                document.getElementById('appDesc').value = app.desc;
                document.getElementById('appIcon').value = app.icon;
            } else {
                document.getElementById('editModalTitle').innerText = "Add New App";
                document.getElementById('appId').value = "";
                document.getElementById('appName').value = "";
                document.getElementById('appUrl').value = "";
                document.getElementById('appDesc').value = "";
                document.getElementById('appIcon').value = "generic";
            }

            modal.style.display = 'flex';
            setTimeout(() => modal.classList.add('active'), 10);
        }

        function closeModals() {
            document.querySelectorAll('.modal-overlay').forEach(el => {
                el.classList.remove('active');
                setTimeout(() => {
                    // Only apply display:none if the modal hasn't been reactivated
                    if (!el.classList.contains('active')) {
                        el.style.display = 'none';
                    }
                }, 300);
            });
        }

        function saveApp() {
            const id = document.getElementById('appId').value;
            const title = document.getElementById('appName').value;
            const url = document.getElementById('appUrl').value;
            const desc = document.getElementById('appDesc').value;
            const icon = document.getElementById('appIcon').value;

            if (!title || !url) return alert('Name and URL are required.');

            if (id) {
                const index = apps.findIndex(a => a.id == id);
                apps[index] = { ...apps[index], title, url, desc, icon };
            } else {
                const newId = apps.length ? Math.max(...apps.map(a => a.id)) + 1 : 1;
                apps.push({ id: newId, title, url, desc, icon });
            }

            renderGrid();
            openSettings(); // Return to settings list
        }

        function deleteApp(id) {
            if(confirm('Remove this app?')) {
                apps = apps.filter(a => a.id !== id);
                renderGrid();
                openSettings();
            }
        }

        // Init
        renderGrid();
    </script>
</body>
</html>
